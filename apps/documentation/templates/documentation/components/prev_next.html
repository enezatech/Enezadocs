{% load home_tags %}
<nav id="prevNext" class="flex w-full gap-3">
  {% if document.previous %}
  <a href="/docs/{{ site.slug }}/{{ document.previous.path|doc_url }}/" class="flex-1 flex flex-col gap-1 rounded-xl border border-line p-4 hover:border-accent hover:bg-bgsoft transition-colors">
    <span class="text-xs text-muted">← Previous</span>
    <span class="text-sm font-medium">{{ document.previous.title }}</span>
  </a>
  {% else %}<div class="flex-1"></div>{% endif %}
  {% if document.next %}
  <a href="/docs/{{ site.slug }}/{{ document.next.path|doc_url }}/" class="flex-1 flex flex-col gap-1 rounded-xl border border-line p-4 text-right hover:border-accent hover:bg-bgsoft transition-colors">
    <span class="text-xs text-muted">Next →</span>
    <span class="text-sm font-medium">{{ document.next.title }}</span>
  </a>
  {% else %}<div class="flex-1"></div>{% endif %}
</nav>
