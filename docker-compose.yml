name: enezadocs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enezadocs}
      POSTGRES_USER: ${POSTGRES_USER:-enezadocs}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-enezadocs} -d ${POSTGRES_DB:-enezadocs}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    environment:
      # Editable domain in the Coolify UI; routes the proxy to container port 8000.
      SERVICE_FQDN_WEB_8000: /
      SERVICE_URL_WEB_8000: /
      # Optional explicit overrides. Leave blank in Coolify so settings.py falls
      # back to the runtime COOLIFY_FQDN / COOLIFY_URL values, which track the
      # resource's domain configuration automatically.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DB_ENGINE: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-enezadocs}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-enezadocs}
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_MEDIA_ROOT: /app/media
      FASTEMBED_CACHE_PATH: /cache/fastembed
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - docs_data:/app/docs
      - fastembed_cache:/cache

volumes:
  pgdata:
  media_data:
  static_data:
  docs_data:
  fastembed_cache:
