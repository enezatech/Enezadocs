name: enezadocs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enezadocs}
      POSTGRES_USER: ${POSTGRES_USER:-enezadocs}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-enezadocs} -d ${POSTGRES_DB:-enezadocs}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    environment:
      # Domain is configured in Coolify's service "Domains" field (no SERVICE_*
      # magic variables, which Coolify injects into every service including db).
      # The app reads the domain from the runtime COOLIFY_FQDN / COOLIFY_URL.
      # Optional explicit overrides. Leave blank in Coolify so settings.py falls
      # back to the runtime COOLIFY_FQDN / COOLIFY_URL values, which track the
      # resource's domain configuration automatically.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      # Optional superuser bootstrap for docker/entrypoint.sh. Set these in
      # Coolify's Environment Variables to create an admin on first deploy;
      # leave DJANGO_SUPERUSER_PASSWORD empty to skip.
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DB_ENGINE: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-enezadocs}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-enezadocs}
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_MEDIA_ROOT: /app/media
      FASTEMBED_CACHE_PATH: /cache/fastembed
      # Optional S3-compatible documentation storage. Leave DOCS_S3_BUCKET
      # blank to use local storage; configure in Coolify's Environment Variables.
      DOCS_S3_BUCKET: ${DOCS_S3_BUCKET:-}
      DOCS_S3_PREFIX: ${DOCS_S3_PREFIX:-}
      DOCS_S3_REGION: ${DOCS_S3_REGION:-}
      DOCS_S3_ENDPOINT_URL: ${DOCS_S3_ENDPOINT_URL:-}
      DOCS_S3_ACCESS_KEY_ID: ${DOCS_S3_ACCESS_KEY_ID:-}
      DOCS_S3_SECRET_ACCESS_KEY: ${DOCS_S3_SECRET_ACCESS_KEY:-}
      DOCS_S3_USE_PATH_STYLE: ${DOCS_S3_USE_PATH_STYLE:-0}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - docs_data:/app/docs
      - fastembed_cache:/cache

volumes:
  pgdata:
  media_data:
  static_data:
  docs_data:
  fastembed_cache:
