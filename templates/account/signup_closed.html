{% extends "documentation/base.html" %}

{% block title %}Registration closed · Documentation{% endblock %}

{% block content %}
<main class="flex-1 min-h-0 overflow-y-auto scroll-col flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md">
    <div class="rounded-2xl border border-line bg-surface shadow-xl overflow-hidden">
      <div class="px-7 pt-8 pb-6">
        <h1 class="text-2xl font-semibold tracking-tight">Registration is closed</h1>
        <p class="mt-1.5 text-sm text-muted">New account sign-up is currently disabled. If you already have an account, you can sign in below.</p>
      </div>

      <div class="px-7 pb-8 grid gap-3">
        <a href="{% url 'account_login' %}" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>
          <span>Sign in</span>
        </a>
        <a href="{% url 'home' %}" class="btn-secondary">Back to home</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
